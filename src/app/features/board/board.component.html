
<main>
  <div class="board-controls">
      <h3><img src="assets/img/icon-2.svg" class="heading-icon"> Task & Project Management
      </h3>
      <div>
          <button class="btn btn-primary"><img src="assets/img/Filter.svg"> Filter</button>
          <button class="btn btn-primary"><img src="assets/img/Subtasks.svg"> Subtasks</button>
          <button class="btn btn-primary"><img src="assets/img/Assignees.svg"> Assignees</button>
          <button class="btn btn-secondary"><img src="assets/img/Board View.svg"> Board View</button>
          <button class="btn btn-info"><img src="assets/img/List View.svg" class="pe-2"> List View</button>
      </div>
  </div>
  <hr>
  <div cdkDropListOrientation="horizontal"  cdkDropList CdkDropListGroup  [cdkDropListData]="columns"  class="board-container d-flex" (cdkDropListDropped)="dropColumn($event)">
    <div class="column" *ngFor="let column of columns" cdkDrag>

      <div class="example-custom-placeholder" *cdkDragPlaceholder></div>
      <div class="d-flex mb-3 column-head align-items-center" >
        <img src="assets/img/six-dots.png"  style="width: 30px; cursor: pointer;" alt="drag handle" cdkDragHandle>
        <h5 class="mt-2">{{ column.name }}</h5>
        <span class="badge badge-warning badge-heading">{{ column.tasks.length }}</span>
        <a href="#" class="ms-auto"><img src="assets/img/dots.svg"></a>
      </div>

      <div
      cdkDropList
      [cdkDropListData]="column.tasks"
      [cdkDropListConnectedTo]="connectedDropLists"
      [id]="'task-list-' + column.name"
      class="task-list"
      (cdkDropListDropped)="dropTask($event)"
      >

      <div *ngIf="!column.tasks.length" class="empty-placeholder">
        ....................
      </div>

        <div class="task-card viewtask_btn" *ngFor="let task of column.tasks" cdkDrag>
          <div class="task-header">
            <p class="task-title">{{ task.title }}</p>
            <div class="top-right-icon">
              <img src="assets/img/Vector 01.svg"><span>{{ task.comments }}</span>
            </div>
          </div>

          <div class="d-flex gap-2 pb-4">
            <span class="badge badge-light badge-custom">#UI007</span>
            <span class="badge badge-primary badge-custom">{{ task.priority }}</span>
          </div>

          <div class="d-flex align-items-center justify-content-between">
            <div class="avatar-group">
              <img src="assets/img/Avatar.png" class="avatar">
              <img src="assets/img/Avatar-1.png" class="avatar">
              <a href="#" class="text-decoration-none"><div class="extra-avatars">+{{ task.members }}</div></a>
              <a href="#" class="ms-2"><img src="assets/img/add.svg"></a>
            </div>

            <div class="d-flex align-items-center gap-3">
              <div class="icon-text text-purple">
                <img src="assets/img/Vector 02.svg"><span>2</span>
              </div>
              <div class="icon-text text-warning">
                <img src="assets/img/Vector 03.svg"><span>3</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="add">
        <a href="#" data-bs-toggle="modal" data-bs-target="#newModal"><img src="assets/img/add-1.svg" class="img-fluid"></a>
    </div>

    </div>




  </div>
</main>
