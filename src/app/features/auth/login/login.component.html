<div class="login-container">
    <div class="row login-box bg-white">
        <div class="col-md-5 p-2">
            <div class="login-image">
                <h2>Welcome Back! Log in to continue.</h2>
                <p class="copyright">Copyright 2025 | All Rights Reserved</p>
            </div>
        </div>
        <div class="col-md-7 d-flex flex-column justify-content-center">
        <div class="content">
            <h2>Login to Your<span> Account</span></h2>
            <p>Enter your credentials to access your account</p>
        <form method="post">
            <div class="mb-4">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter Email Address" required autocomplete="off">
                <!-- <small>Example: examplegmail.com</small> -->
            </div>
            <div class="mb-4 password-wrapper">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your account password" required autocomplete="new-password">
                <img src="../../../../assets/img/eye.svg/" class="toggle-password" width="20">
                <!-- <small>Enter your account password</small> -->
                <small>
                    <a [routerLink]="['/auth/forgot-password']" class="links links-primary no-underline">Forgot Password?</a>
                </small>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="signup-action-footer text-center mt-3">
            <p class="login-txt">Don't have an account? 
                <a [routerLink]="['/auth/signup']" class="links links-primary no-underline">Sign Up</a>
            </p>
        </div>
               
        </div>
    </div>
    </div>
  </div>
